format = """
[╭ ](#35312)\
[](#313244)\
$os\
$sudo\
$hostname\
$username\
[](bg:#313244 fg:#212736)\
[](bg:#002240 fg:#212736)\
$directory\
$git_branch\
$git_status\
[](bg:#313244 fg:#212736)\
[](bg:#002240 fg:#212736)\
[](#002240)\
$fill\
$nodejs\
$rust\
$python\
$golang\
$php\
$java\
[](#002240)\
$jobs\
$status\
[](bg:#002240 fg:#212736)\
[](bg:#313244 fg:#212736)\
$shell\
$cmd_duration\
[](bg:#002240 fg:#212736)\
[](bg:#313244 fg:#212736)\
