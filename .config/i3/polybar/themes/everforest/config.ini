[global/wm]
margin-bottom = 0
margin-top = 0

include-file = modules.ini
include-file = decor.ini
include-file = colors.ini

[bar/main]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = true

bottom = false
fixed-center = false

width = 100%
height = 2%

offset-x = 0%
offset-y = 0

background = ${color.bg}
foreground = ${color.fg}

radius-bottom = 25

line-size = 3
line-color = ${color.blue}

border-size = 10
border-color = ${color.bg}

padding-left = 2
padding-right = 1

module-margin-left = 0
module-margin-right = 0

font-0 = "JetBrainsMono Nerd Font Propo:style=Regular:size=12;3"
font-1 = "Material Design Icons Desktop:size=13;3"
font-2 = "JetBrainsMono Nerd Font Propo:style=Regular:size=13;3"
font-3 = "JetBrainsMono Nerd Font Propo:style=Bold:size=16;3"

;Modules availables but not active:
;	brightness		weather		xkeyboard
modules-left = launcher sep boi bod xworkspaces boi bod sep title
modules-center =
modules-right = batr battery batl bri filesystem brd byi cpu byd bpi memory bpd  boi eth bod bii date bid  bbi pulseaudio bbd  boi bod tray sep power sep

separator =
dim-value = 1.0
;locale = es_MX.UTF-8

wm-restack = i3
enable-ipc = true

cursor-click = pointer
cursor-scroll =

[settings]

screenchange-reload = true

compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

pseudo-transparency = false
