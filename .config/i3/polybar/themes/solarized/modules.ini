label-occupied = %{B#191f22}%{F#686D6F}%{T2} %{T-}%{B#686D6F}%{F#1A232E}%{u#191f22}%{+u}%{T1}%{o#191f22}%{+o}%icon%%{T-}%{F-}%{-u}%{-o}%{B#191f22}%{F#686D6F}%{T2} %{T-}%{F-}%{B-} 
