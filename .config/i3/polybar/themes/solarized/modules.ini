label-active = %{B#191f22}%{F#c3a5e6}%{T2} %{T-}%{B#c3a5e6}%{F#1A232E}%{u#191f22}%{+u}%{T2}%{o#191f22}%{+o} %icon% %{T-}%{F-}%{-u}%{-o}%{B#191f22}%{F#c3a5e6}%{T2} %{T-}%{F-}%{B-} 
