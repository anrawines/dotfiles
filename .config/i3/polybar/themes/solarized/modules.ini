[module/alsa]
type = internal/alsa

; Soundcard to be used
; Usually in the format hw:# where # is the card number
; You can find the different card numbers in `/proc/asound/cards`
master-soundcard = default
speaker-soundcard = default
headphone-soundcard = default

; Name of the master, speaker and headphone mixers
; Use the following command to list available mixer controls:
; $ amixer scontrols | sed -nr "s/.*'([[:alnum:]]+)'.*/\1/p"
; If master, speaker or headphone-soundcard isn't the default, 
; use `amixer -c # scontrols` instead where # is the number 
; of the master, speaker or headphone soundcard respectively
;
; Default: Master
master-mixer = Master

; Optionally define speaker and headphone mixers
; Default: none
;;speaker-mixer = Speaker
; Default: none
;;headphone-mixer = Headphone

; NOTE: This is required if headphone_mixer is defined
; Use the following command to list available device controls
; $ amixer controls | sed -r "/CARD/\!d; s/.*=([0-9]+).*name='([^']+)'.*/printf '%3.0f: %s\n' '\1' '\2'/e" | sort
; You may also need to use `amixer -c # controls` as above for the mixer names
; Default: none
;;headphone-id = 9

; Use volume mapping (similar to amixer -M and alsamixer), where the increase in volume is linear to the ear
; Default: false
;;mapped = true

; Interval for volume increase/decrease (in percent points)
; Default: 5
interval = 5

; Available tags:
;   <label-volume> (default)
;   <ramp-volume>
;   <bar-volume>
;format-volume = <ramp-volume><label-volume>
;format-volume = <label-volume><bar-volume>
format-volume = <ramp-volume>
;format-volume-background = ${color.bg1}
;format-volume-padding = 0

; Available tags:
;   <label-muted> (default)
;   <ramp-volume>
;   <bar-volume>
format-muted = <label-muted>
;format-muted-prefix = ""
;format-muted-prefix-font = 3
;format-muted-prefix-foreground = ${color.blue}
;format-muted-prefix-background = ${color.bg1}
;format-muted-background = ${color.bg1}
;format-muted-padding = 0

; Available tokens:
;   %percentage% (default)
;label-volume = " %percentage%% "
;label-volume = "  "
;label-volume-foreground = ${color.fg}
;label-volume-background = ${color.bg}

;bar-volume-width = 8
;bar-volume-foreground = ${color.CYAN}
;bar-volume-foreground-0 = ${color.blue}
;bar-volume-foreground-1 = ${color.blue}
;bar-volume-foreground-2 = ${color.blue}
;bar-volume-foreground-3 = ${color.yellow}
;bar-volume-foreground-4 = ${color.yellow}
;bar-volume-foreground-5 = ${color.red}
;bar-volume-foreground-6 = ${color.red}
;bar-volume-foreground-7 = ${color.red}
;bar-volume-fill = "━"
;bar-volume-fill = ""
;bar-volume-fill = ""
;bar-volume-fill = " "
;bar-volume-fill-foreground = ${color.CYAN}
;bar-volume-fill-font = 1
;bar-volume-fill-background = ${color.black}

;bar-volume-empty = ""
;bar-volume-empty = "━"
;bar-volume-empty = ""
;bar-volume-empty = " "
;bar-volume-empty-font = 1
;bar-volume-empty-foreground = ${color.fg}
;bar-volume-empty-background = ${color.black}

;bar-volume-indicator = ""
;bar-volume-indicator = ""
;bar-volume-indicator-foreground = ${color.cyan}
;bar-volume-indicator-font = 3 

; Available tokens:
;   %percentage% (default
;label-muted = " Muted "
label-muted = " "
label-muted-font = 3
label-muted-foreground = ${color.bg2}
label-muted-background = ${color.bg1}

; Only applies if <ramp-volume> is used
ramp-volume-0 = " "
ramp-volume-1 = " " 
ramp-volume-2 = " "
ramp-volume-foreground = ${color.blue}
ramp-volume-background = ${color.bg1}
ramp-volume-font = 3

; If defined, it will replace <ramp-volume> when
; headphones are plugged in to `headphone_control_numid`
; If undefined, <ramp-volume> will be used for both
; Only applies if <ramp-volume> is used
ramp-headphones-0 = " "

