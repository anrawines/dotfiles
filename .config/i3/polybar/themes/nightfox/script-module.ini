[module/power-profile]
type = custom/script

# This command checks the current profile and outputs an icon/text
exec = bash -c "if [ $(powerprofilesctl get) = 'power-saver' ]; then echo ' Saver'; else echo ' Balanced'; fi"

# How often to check the status
interval = 10

# Left-click opens the YAD menu
click-left = ~/.local/bin/yad-power-profile

# Styling
format-foreground = #FFFFFF
format-background = #005475
format-padding = 1
